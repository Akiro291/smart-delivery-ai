# Ruff configuration — drop-in replacement for flake8 + black + isort

# Target Python version
target-version = "py312"

# Maximum line length
line-length = 120

# Lint rules
[lint]
# Select subsets of rules
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # type-checking
]

# Ignore specific rules
ignore = [
    "E501",  # line too long (handled by formatter)
    "SIM105",# contextlib.suppress (preference)
    "B008",  # Do not perform function call in argument defaults (FastAPI Depends pattern)
    "B904",  # raise ... from err (Celery retry pattern is intentional)
    "UP042", # StrEnum (Python 3.11+, we target 3.12 but str+Enum is valid)
]

# isort settings
[lint.isort]
known-first-party = ["app"]

# Formatter settings
[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
