# Nginx configuration for Smart Delivery AI Platform
# Proxy: / -> frontend (Nuxt 3), /api|/uploads|/docs|/health -> backend, /api/v1/ws -> backend WebSocket

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream backend {
        server backend:8000;
    }

    upstream frontend-nuxt {
        server frontend:3000;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 10m;

        # WebSocket (real-time tracking)
        location /api/v1/ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Backend API
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger / ReDoc / health
        location ~ ^/(docs|redoc|openapi.json|health)$ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Uploaded files served by the backend
        location /uploads/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Static assets of Nuxt
        location /_nuxt/ {
            proxy_pass http://frontend-nuxt;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Root path serves Nuxt
        location / {
            proxy_pass http://frontend-nuxt;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
