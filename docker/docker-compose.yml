# Docker Compose configuration for Smart Delivery AI Platform
version: '3.8'

services:
  # PostgreSQL database
  db:
    image: postgres:15-alpine
    container_name: smart_delivery_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_delivery}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./docker/scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5432:5432"
    networks:
      - smart_delivery_network

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: smart_delivery_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - smart_delivery_network

  # RabbitMQ message broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: smart_delivery_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - smart_delivery_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_delivery_backend
    restart: always
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-smart_delivery}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/smart_delivery
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your-openai-api-key-here}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-your-telegram-bot-token-here}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-your-email@gmail.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-your-app-password}
      - SMTP_FROM=${SMTP_FROM:-noreply@smartdelivery.ai}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DOCKER_ENV=true
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
    depends_on:
      - db
      - redis
      - rabbitmq
    networks:
      - smart_delivery_network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: smart_delivery_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
    networks:
      - smart_delivery_network

  # Frontend Nuxt 3
  frontend-nuxt:
    build:
      context: ./frontend/nuxt3-app
      dockerfile: Dockerfile
    container_name: smart_delivery_frontend_nuxt
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - smart_delivery_network

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  smart_delivery_network:
    driver: bridge